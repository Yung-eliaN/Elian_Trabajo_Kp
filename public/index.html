<!-- Custom Styles: Marquee & Canvas Shading -->
<style data-purpose="marquee-animation">
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 22s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
<style data-purpose="brutalist-grid-utils">
    /* Subtle paper noise texture on the concrete gray background */
    .concrete-bg {
      background-color: #E6E6E6;
      background-image: radial-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 0);
      background-size: 24px 24px;
    }
    /* Technical crosshairs (+) */
    .crosshair-corner {
      position: relative;
    }
    .crosshair-corner::before {
      content: "+";
      position: absolute;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      color: #000000;
      z-index: 20;
    }
    .corner-tl::before { top: -7px; left: -5px; }
    .corner-tr::before { top: -7px; right: -5px; }
    .corner-bl::before { bottom: -7px; left: -5px; }
    .corner-br::before { bottom: -7px; right: -5px; }
  </style>

</head>
