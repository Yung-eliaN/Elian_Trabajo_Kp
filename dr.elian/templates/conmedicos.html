<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Registro de Medicos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#363636",
                    "secondary-container": "#85f6e5",
                    "secondary-fixed": "#85f6e5",
                    "surface-variant": "#e3e2e2",
                    "outline": "#747878",
                    "tertiary-fixed-dim": "#43dbd8",
                    "on-secondary-fixed-variant": "#005048",
                    "on-primary": "#ffffff",
                    "on-tertiary-container": "#00b1af",
                    "on-tertiary-fixed": "#00201f",
                    "surface-bright": "#faf9f9",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#444748",
                    "inverse-on-surface": "#f1f0f0",
                    "on-secondary-fixed": "#00201c",
                    "tertiary-fixed": "#67f7f5",
                    "on-primary-fixed": "#1b1c1c",
                    "secondary-fixed-dim": "#67d9c9",
                    "on-secondary-container": "#007166",
                    "surface-container-highest": "#e3e2e2",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#2f3131",
                    "on-tertiary-fixed-variant": "#00504f",
                    "background": "#faf9f9",
                    "on-background": "#1a1c1c",
                    "primary-fixed": "#e4e2e1",
                    "on-primary-container": "#a09f9e",
                    "tertiary-container": "#003d3c",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#c8c6c6",
                    "on-primary-fixed-variant": "#474747",
                    "secondary": "#006a60",
                    "on-error": "#ffffff",
                    "surface-tint": "#5f5e5e",
                    "outline-variant": "#c4c7c7",
                    "primary-fixed-dim": "#c8c6c6",
                    "surface-container-low": "#f4f3f3",
                    "surface-dim": "#dadada",
                    "tertiary": "#002525",
                    "error": "#ba1a1a",
                    "on-surface": "#1a1c1c",
                    "surface-container": "#eeeeed",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e8e8e8",
                    "on-tertiary": "#ffffff",
                    "primary": "#212121",
                    "surface": "#faf9f9"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "margin-desktop": "64px",
                    "sm": "12px",
                    "md": "24px",
                    "lg": "48px",
                    "margin-mobile": "16px",
                    "base": "8px",
                    "xl": "80px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "headline-lg": ["Montserrat"],
                    "caption": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Montserrat"],
                    "display-lg": ["Montserrat"],
                    "headline-lg-mobile": ["Montserrat"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body>
<div class="mt-lg bg-surface rounded-xl shadow-sm border border-outline-variant overflow-hidden">
<div class="px-md py-4 border-b border-outline-variant bg-surface-bright flex justify-between items-center">
<h3 class="font-headline-md text-headline-md text-primary-container text-lg">Medicos Recientes</h3>
<button class="text-on-tertiary-container font-label-md text-label-md hover:underline flex items-center gap-1">
                            Ver todos
                            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>



    <div class="overflow-x-auto"> 



    <table class="w-full text-left border-collapse"> 

        <thead> 

            <tr> 

                <th>Numero Medico</th> 

                <th>Nombre Medico</th> 

                <th>Apellido Medico</th>
                
                <th>Acciones</th> 


            </tr> 

        </thead> 

        <tbody> 

            {% for med in medicos %} 

            <tr> 

                <td>{{ med['idMed'] }}</td> 

                <td>{{ med['nombresMed'] }}</td> 

                <td>{{ med['apellidosMed'] }}</td> 


                <td><button class="px-md py-2 border border-outline-variant text-on-surface-variant font-label-md text-label-md rounded-lg hover:bg-surface-container transition-colors focus:ring-2 focus:ring-outline-variant focus:outline-none" type="button">editar</button>
                <button class="px-md py-2 border border-outline-variant text-on-surface-variant font-label-md text-label-md rounded-lg hover:bg-surface-container transition-colors focus:ring-2 focus:ring-outline-variant focus:outline-none" type="button">borrar</button></td>



            </tr> 

            {% endfor %} 

        </tbody> 

    </table> 

</div> 



</body>
</html>
